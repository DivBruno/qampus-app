<app-navbar></app-navbar>

<main class="duvida-container">

  <section class="main-content">

    @if (post) {

      <div class="question">

        <div class="vote-area">

          <button
            type="button"
            class="vote-button"
            (click)="votar(1)">
            △
          </button>

          <span class="vote-count">
            {{ post.upVotes - post.downVotes }}
          </span>

          <button
            type="button"
            class="vote-button"
            (click)="votar(-1)">
            ▽
          </button>

        </div>


        <div class="question-content">

          <h2>{{ post.title }}</h2>

          <div class="tags">

            @for (tag of post.tags; track tag.id) {
              <span class="tag">
                {{ tag.name }}
              </span>
            }

          </div>


          <p class="descricao">
            {{ post.content }}
          </p>

          <div class="responder-area">

            <h3>Responder dúvida</h3>

            <label for="resposta">
              Sua resposta
            </label>

            <textarea
              id="resposta"
              [(ngModel)]="novaResposta"
              placeholder="Escreva sua resposta..."
              rows="5">
            </textarea>

            <button
              type="button"
              (click)="responder()">
              Responder
            </button>

          </div>

        </div>

      </div>

    } @else {

      <p>Carregando dúvida...</p>

    }

  </section>


  <aside class="relacionadas">

    <h3>Relacionadas:</h3>

    <!-- Será integrado quando o backend disponibilizar
         os dados de dúvidas relacionadas. -->

  </aside>

</main>
