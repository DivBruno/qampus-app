name: Frontend Angular CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/frontend-qampus-app/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/frontend-qampus-app/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/frontend-qampus-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/frontend-qampus-app/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npx ng test --watch=false

      - name: Fazer build
        run: npx ng build