name: Backend Spring Boot CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/backend-qampus-app/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/backend-qampus-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/backend-qampus-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Executar testes com perfil de teste
        run: mvn -B clean test -Dspring.profiles.active=test

      - name: Verificar relatório JaCoCo
        run: |
          ls -la target/site/jacoco/
          test -f target/site/jacoco/jacoco.xml
      
      - name: Fazer build
        run: mvn -B package -DskipTests

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/backend-qampus-app/target/site/jacoco/

      - name: Análise de qualidade (SonarCloud)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=qampus-ufape_qampus-app
          -Dsonar.organization=qampus-ufape
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml